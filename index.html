<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archipel des idées — Naviguer dans la pensée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --noir: #020304;
  --rouge: #ff2a2a;
  --rouge-dim: rgba(255,42,42,0.15);
  --or: #c8a96e;
  --text: #a0b0c0;
  --text-dim: #404858;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'DM Mono', monospace;
}

html, body {
  height: 100%;
  overflow: hidden;
  margin: 0;
}

body {
  background: var(--noir);
  font-family: var(--mono);
  color: var(--text);
  cursor: crosshair;
}

/* ============================================================
   CANVAS PRINCIPAL
   ============================================================ */
#map-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 1.5rem 2rem;
  pointer-events: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.header-title {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 300;
  font-style: italic;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.header-title span {
  display: block;
  font-family: var(--mono);
  font-size: 9px;
  font-style: normal;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 0.3rem;
}
.header-coords {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  text-align: right;
  line-height: 1.8;
}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  padding: 1.25rem 2rem;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.footer-hint {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.footer-count {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ============================================================
   TOOLTIP
   ============================================================ */
.tooltip {
  position: fixed;
  z-index: 200;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
  transform: translate(-50%, calc(-100% - 18px));
}
.tooltip.visible { opacity: 1; }
.tooltip-inner {
  background: rgba(2,3,4,0.96);
  border: 1px solid rgba(255,42,42,0.3);
  border-top: 2px solid var(--rouge);
  padding: 0.8rem 1.1rem;
  min-width: 200px;
  max-width: 240px;
  text-align: left;
}
.tt-type {
  font-size: 8.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,42,42,0.7);
  margin-bottom: 0.35rem;
}
.tt-name {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 400;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 0.4rem;
}
.tt-desc {
  font-size: 0.76rem;
  color: rgba(160,176,192,0.7);
  line-height: 1.55;
  margin-bottom: 0.5rem;
  font-family: var(--mono);
  font-weight: 300;
}
.tt-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 0.5rem;
}
.tt-tag {
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,42,42,0.6);
  border: 1px solid rgba(255,42,42,0.2);
  padding: 2px 6px;
}
.tt-cta {
  font-size: 8.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rouge);
  border-top: 1px solid rgba(255,42,42,0.15);
  padding-top: 0.45rem;
}

/* ============================================================
   INTRO
   ============================================================ */
.intro {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2,3,4,0.88);
  transition: opacity 0.8s ease;
}
.intro.out { opacity: 0; pointer-events: none; }
.intro-box {
  text-align: center;
  max-width: 420px;
  padding: 0 2rem;
  animation: rise 1s ease forwards;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}
.intro-title {
  font-family: var(--serif);
  font-size: clamp(2.8rem, 7vw, 4.5rem);
  font-weight: 300;
  font-style: italic;
  color: #fff;
  line-height: 1.05;
  margin-bottom: 1rem;
}
.intro-sub {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 300;
  letter-spacing: 0.05em;
  color: rgba(160,176,192,0.6);
  line-height: 1.75;
  margin-bottom: 2rem;
}
.intro-btn {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--rouge);
  border: 1px solid rgba(255,42,42,0.4);
  padding: 0.8rem 2.2rem;
  cursor: pointer;
  background: none;
  transition: background 0.2s, border-color 0.2s;
}
.intro-btn:hover {
  background: rgba(255,42,42,0.08);
  border-color: rgba(255,42,42,0.7);
}

/* ============================================================
   ANIMATIONS CSS
   ============================================================ */
@keyframes signal-pulse {
  0%   { opacity: 1;   transform: scale(1); }
  40%  { opacity: 0.15; transform: scale(0.7); }
  70%  { opacity: 0.9;  transform: scale(1.05); }
  100% { opacity: 1;   transform: scale(1); }
}
@keyframes ring-expand {
  0%   { r: 0; opacity: 0.8; }
  100% { r: 36; opacity: 0; }
}
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="intro-box">
    <h1 class="intro-title">Archipel<br>des idées</h1>
    <p class="intro-sub">Vue satellite · Nuit · Dix îles intellectuelles<br>Survolez un signal. Cliquez pour atterrir.</p>
    <button class="intro-btn" onclick="closeIntro()">Accéder à la carte →</button>
  </div>
</div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-title">
    Archipel des idées
    <span>Portail de navigation intellectuelle</span>
  </div>
  <div class="header-coords" id="coords">
    <!-- coordonnées dynamiques -->
  </div>
</header>

<!-- SVG MAP -->
<svg id="map-canvas" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond terrestre nocturne — couches atmosphériques -->
    <radialGradient id="earth-glow" cx="38%" cy="42%" r="65%">
      <stop offset="0%"   stop-color="#0a0f18"/>
      <stop offset="40%"  stop-color="#050810"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Lueur atmosphérique sur les bords -->
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,20,50,0.4)"/>
    </radialGradient>

    <!-- Filtre brume -->
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-strong">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Glow rouge pour les points actifs -->
    <filter id="red-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="red-glow-strong" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Masque vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>

  <!-- FOND TERRE NOCTURNE -->
  <rect width="100%" height="100%" fill="url(#earth-glow)"/>

  <!-- Continents stylisés (Asie du Sud-Est / Indonésie) — masses terrestres sombres -->
  <g id="landmass" opacity="0.55">
    <!-- Masse principale Asia SE -->
    <ellipse cx="44%" cy="35%" rx="22%" ry="14%" fill="#0d1420" opacity="0.8"/>
    <!-- Péninsule malaise -->
    <ellipse cx="46%" cy="48%" rx="5%" ry="10%" fill="#0c1318" opacity="0.7"/>
    <!-- Sumatra -->
    <ellipse cx="36%" cy="56%" rx="10%" ry="4%" fill="#0b1218" transform="rotate(-18,36%,56%)" opacity="0.75"/>

    <!-- Bornéo -->

    <!-- Sulawesi approximatif -->
    <ellipse cx="70%" cy="52%" rx="4%" ry="7%" fill="#0b1218" opacity="0.65"/>
    <!-- Papouasie -->
    <ellipse cx="80%" cy="56%" rx="10%" ry="5%" fill="#0c1318" opacity="0.68"/>
    <!-- Philippines -->
    <ellipse cx="66%" cy="38%" rx="4%" ry="8%" fill="#0c1318" opacity="0.6"/>
    <!-- Australie nord -->
    <ellipse cx="68%" cy="78%" rx="18%" ry="10%" fill="#0d1420" opacity="0.6"/>
    <!-- Inde -->
    <ellipse cx="28%" cy="32%" rx="7%" ry="10%" fill="#0c1318" opacity="0.55"/>
  </g>

  <!-- Lueurs de villes existantes — petits clusters de lumière dorée/blanche -->
  <g id="city-lights" opacity="0.4">
    <!-- Jakarta -->
    <circle cx="49.5%" cy="63.5%" r="3" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.8"/>
    <circle cx="49.5%" cy="63.5%" r="1.2" fill="#fff5cc"/>
    <!-- Singapour -->
    <circle cx="46.8%" cy="57.5%" r="2.5" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.9"/>

    <!-- Kuala Lumpur -->
    <circle cx="45.5%" cy="54%" r="2" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.7"/>
    <!-- Bangkok -->

    <!-- Surabaya -->
    <circle cx="52%" cy="64%" r="1.8" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.6"/>
    <!-- Ho Chi Minh -->
    <circle cx="48%" cy="47%" r="2" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.65"/>
    <!-- Mumbai -->
    <circle cx="24%" cy="34%" r="2.2" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.6"/>
    <!-- Sydney -->
    <circle cx="78%" cy="82%" r="2.5" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.65"/>
    <!-- Darwin -->
    <circle cx="66%" cy="74%" r="1.5" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.5"/>
    <!-- Tokyo lointain -->
    <circle cx="82%" cy="30%" r="3" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.5"/>
    <!-- Shanghai -->
    <circle cx="72%" cy="28%" r="2.5" fill="#ffcc55" filter="url(#blur-soft)" opacity="0.5"/>
    <!-- Lumières dispersées -->
    <circle cx="55%" cy="40%" r="1" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.4"/>
    <circle cx="60%" cy="44%" r="0.8" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.35"/>
    <circle cx="63%" cy="60%" r="1.2" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.4"/>
    <circle cx="74%" cy="58%" r="1" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.35"/>
    <circle cx="36%" cy="50%" r="0.8" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.3"/>
    <circle cx="39%" cy="46%" r="1" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.35"/>
    <circle cx="30%" cy="28%" r="1.5" fill="#ffcc88" filter="url(#blur-soft)" opacity="0.3"/>
  </g>

  <!-- Brume atmosphérique / nuages légers -->
  <g id="clouds" opacity="0.12">
    <ellipse cx="25%" cy="22%" rx="18%" ry="8%" fill="#3a5080" filter="url(#blur-strong)"/>

    <ellipse cx="15%" cy="60%" rx="10%" ry="6%" fill="#304060" filter="url(#blur-strong)"/>
    <ellipse cx="55%" cy="80%" rx="20%" ry="7%" fill="#283858" filter="url(#blur-strong)"/>

  <!-- CONNEXIONS entre îles -->

  <!-- SIGNAUX ROUGES (îles) -->

  <!-- Vignette bords -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>

  <!-- Scan line subtil (effet satellite) -->

        style="background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.015) 3px, rgba(0,0,0,0.015) 4px);"
        pointer-events="none" opacity="0.6"/>
</svg>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-inner">
    <p class="tt-type" id="tt-type"></p>
    <p class="tt-name" id="tt-name"></p>
    <p class="tt-desc" id="tt-desc"></p>
    <div class="tt-tags" id="tt-tags"></div>

</div>

<!-- FOOTER -->
<footer class="site-footer">

<script>
// ============================================================
// DONNÉES — positions sur la carte (0–1 relatif à la fenêtre)
// Dispersées comme un vrai archipel indonésien
// ============================================================
const ILES = [
  {
    id: 'meirieu',
    href: 'meirieu.html',
    name: 'Philippe Meirieu',
    type: 'Pédagogue · France',
    desc: 'L\'apprentissage comme émancipation.',
    tags: ['Pédagogie', 'Émancipation', 'École'],
    px: 0.22, py: 0.28,
    r: 4.5,
    ponts: ['gestalt','paloalto','lewin','rogers','morin','bateson'],
    delay: 0
  },
  {
    id: 'paloalto',
    href: 'palo-alto.html',
    name: 'École de Palo Alto',
    type: 'École de pensée · Californie, 1950s',
    desc: 'Communication, systèmes, double contrainte.',
    tags: ['Systémique', 'Communication', 'Cybernétique'],
    px: 0.50, py: 0.20,
    r: 5.5,
    ponts: ['bateson','wiener','gestalt','meirieu','at'],
    delay: 0.4
  },
  {
    id: 'gestalt',
    href: 'gestalt.html',
    name: 'Gestalt-thérapie',
    type: 'Approche thérapeutique · New York, 1951',
    desc: 'L\'organisme en contact avec son monde.',
    tags: ['Contact', 'Phénoménologie', 'Présent'],
    px: 0.33, py: 0.50,
    r: 4.5,
    ponts: ['paloalto','meirieu','lewin','rogers','at'],
    delay: 0.7
  },
  {
    id: 'at',
    href: 'at.html',
    name: 'Analyse Transactionnelle',
    type: 'Théorie de la personnalité · 1958',
    desc: 'Parent, Adulte, Enfant. Les jeux psychologiques.',
    tags: ['États du Moi', 'Relation', 'Scénario'],
    px: 0.58, py: 0.42,
    r: 4.5,
    ponts: ['gestalt','paloalto','meirieu','rogers','lewin'],
    delay: 1.0
  },
  {
    id: 'lewin',
    href: 'lewin.html',
    name: 'Kurt Lewin',
    type: 'Psychologue social · 1890–1947',
    desc: 'B = f(P,E). Champ, groupes, changement.',
    tags: ['Théorie du champ', 'Dynamique', 'Leadership'],
    px: 0.38, py: 0.70,
    r: 4.5,
    ponts: ['gestalt','meirieu','at','rogers','bateson','wiener'],
    delay: 0.3
  },
  {
    id: 'rogers',
    href: 'rogers.html',
    name: 'Carl Rogers',
    type: 'Psychologue humaniste · 1902–1987',
    desc: 'Empathie, congruence, considération positive.',
    tags: ['ACP', 'Empathie', 'Humanisme'],
    px: 0.20, py: 0.66,
    r: 4,
    ponts: ['gestalt','at','lewin','meirieu'],
    delay: 0.9
  },
  {
    id: 'morin',
    href: 'morin.html',
    name: 'Edgar Morin',
    type: 'Philosophe · né en 1921',
    desc: 'Relier · Distinguer · Ne pas réduire.',
    tags: ['Complexité', 'Transdisciplinarité'],
    px: 0.70, py: 0.60,
    r: 4.5,
    ponts: ['paloalto','lewin','wiener','bateson'],
    delay: 0.6
  },
  {
    id: 'wiener',
    href: 'wiener.html',
    name: 'Norbert Wiener',
    type: 'Mathématicien · MIT, 1894–1964',
    desc: 'Le père de la cybernétique. Le feedback.',
    tags: ['Cybernétique', 'Feedback', 'Information'],
    px: 0.63, py: 0.24,
    r: 6,
    ponts: ['bateson','paloalto','morin','lewin'],
    delay: 0.2
  },
  {
    id: 'bateson',
    href: 'bateson.html',
    name: 'Gregory Bateson',
    type: 'Anthropologue & théoricien · 1904–1980',
    desc: 'La structure qui connecte. L\'écologie de l\'esprit.',
    tags: ['Double lien', 'Niveaux logiques', 'Patterns'],
    px: 0.52, py: 0.55,
    r: 7,
    ponts: ['wiener','paloalto','morin','lewin','gestalt','meirieu'],
    delay: 0.1
  }
];

// ============================================================
// UTILITAIRES
// ============================================================
const svg = document.getElementById('map-canvas');
const gConn = document.getElementById('connections');
const gIsles = document.getElementById('islands');
const tooltip = document.getElementById('tooltip');
const coordsEl = document.getElementById('coords');

const NS = 'http://www.w3.org/2000/svg';

function W() { return window.innerWidth; }
function H() { return window.innerHeight; }

function pos(ile) {
  // Marges pour rester dans la zone visible
  const mx = 0.08, my = 0.14;
  return {
    x: mx * W() + ile.px * (1 - 2*mx) * W(),
    y: my * H() + ile.py * (1 - 2*my) * H()
  };
}

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  return e;
}

// ============================================================
// CONSTRUCTION DE LA CARTE
// ============================================================
function buildMap() {
  gConn.innerHTML = '';
  gIsles.innerHTML = '';

  const scale = Math.min(W(), H()) / 800;

  // 1. CONNEXIONS
  const drawn = new Set();
  ILES.forEach(ile => {
    const p1 = pos(ile);
    ile.ponts.forEach(id2 => {
      const key = [ile.id, id2].sort().join('|');
      if (drawn.has(key)) return;
      drawn.add(key);
      const ile2 = ILES.find(i => i.id === id2);
      if (!ile2) return;
      const p2 = pos(ile2);
      const line = el('line', {
        x1: p1.x, y1: p1.y,
        x2: p2.x, y2: p2.y,
        stroke: 'rgba(255,42,42,0.12)',
        'stroke-width': 0.6,
        'stroke-dasharray': '3 8'
      });
      line.dataset.k = key;
      line.dataset.a = ile.id;
      line.dataset.b = id2;
      gConn.appendChild(line);
    });
  });

  // 2. ÎLES — signaux rouges
  ILES.forEach((ile, i) => {
    const {x, y} = pos(ile);
    const r = ile.r * Math.max(0.75, scale);

    const g = document.createElementNS(NS, 'g');
    g.dataset.id = ile.id;
    g.style.cursor = 'pointer';

    // Halo externe large (premier pulse)
    const halo2 = el('circle', {
      cx: x, cy: y, r: r * 5,
      fill: 'rgba(255,42,42,0.04)',
      class: 'halo-outer'
    });
    g.appendChild(halo2);

    // Halo intermédiaire
    const halo1 = el('circle', {
      cx: x, cy: y, r: r * 3,
      fill: 'rgba(255,42,42,0.08)',
      class: 'halo-mid'
    });
    g.appendChild(halo1);

    // Anneau d'expansion (animation)
    const ring = el('circle', {
      cx: x, cy: y, r: r,
      fill: 'none',
      stroke: 'rgba(255,42,42,0.5)',
      'stroke-width': 1,
      class: 'ring'
    });
    ring.style.transformOrigin = `${x}px ${y}px`;
    ring.style.animation = `ring-out ${2 + ile.delay}s ease-out ${ile.delay}s infinite`;
    g.appendChild(ring);

    // Point rouge principal
    const dot = el('circle', {
      cx: x, cy: y, r: r,
      fill: '#ff2a2a',
      filter: 'url(#red-glow)',
      class: 'dot-main'
    });
    dot.style.animation = `blink-signal ${1.8 + i * 0.15}s ease-in-out ${ile.delay * 0.5}s infinite`;
    g.appendChild(dot);

    // Coeur brillant
    const core = el('circle', {
      cx: x, cy: y, r: r * 0.4,
      fill: 'rgba(255,180,180,0.9)',
      class: 'dot-core'
    });
    g.appendChild(core);

    // Événements
    g.addEventListener('mouseenter', e => onEnter(ile, g, dot, halo1, halo2, r, e));
    g.addEventListener('mouseleave', e => onLeave(ile, g, dot, halo1, halo2, r));
    g.addEventListener('mousemove', e => {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top  = (e.clientY - 8) + 'px';
    });
    g.addEventListener('click', () => window.location.href = ile.href);

    gIsles.appendChild(g);
  });
}

// ============================================================
// HOVER
// ============================================================
function onEnter(ile, g, dot, halo1, halo2, r, e) {
  // Grossir le point
  dot.setAttribute('r', r * 2.5);
  dot.setAttribute('filter', 'url(#red-glow-strong)');
  halo1.setAttribute('r', r * 5);
  halo1.setAttribute('fill', 'rgba(255,42,42,0.14)');
  halo2.setAttribute('r', r * 9);
  halo2.setAttribute('fill', 'rgba(255,42,42,0.06)');

  // Connexions
  document.querySelectorAll('[data-k]').forEach(line => {
    const ids = [line.dataset.a, line.dataset.b];
    if (ids.includes(ile.id)) {
      line.setAttribute('stroke', 'rgba(255,42,42,0.55)');
      line.setAttribute('stroke-width', 1);
      line.setAttribute('stroke-dasharray', '0');
    } else {
      line.setAttribute('stroke', 'rgba(255,42,42,0.04)');
    }
  });

  // Autres îles
  ILES.forEach(a => {
    if (a.id === ile.id) return;
    const grp = gIsles.querySelector(`[data-id="${a.id}"]`);
    if (!grp) return;
    grp.style.opacity = ile.ponts.includes(a.id) ? '1' : '0.25';
  });

  // Tooltip
  document.getElementById('tt-type').textContent = ile.type;
  document.getElementById('tt-name').textContent = ile.name;
  document.getElementById('tt-desc').textContent = ile.desc;
  const tagsEl = document.getElementById('tt-tags');
  tagsEl.innerHTML = ile.tags.map(t => `<span class="tt-tag">${t}</span>`).join('');
  tooltip.style.left = e.clientX + 'px';
  tooltip.style.top  = (e.clientY - 8) + 'px';
  tooltip.classList.add('visible');

  document.body.style.cursor = 'pointer';
}

function onLeave(ile, g, dot, halo1, halo2, r) {
  dot.setAttribute('r', r);
  dot.setAttribute('filter', 'url(#red-glow)');
  halo1.setAttribute('r', r * 3);
  halo1.setAttribute('fill', 'rgba(255,42,42,0.08)');
  halo2.setAttribute('r', r * 5);
  halo2.setAttribute('fill', 'rgba(255,42,42,0.04)');

  document.querySelectorAll('[data-k]').forEach(line => {
    line.setAttribute('stroke', 'rgba(255,42,42,0.12)');
    line.setAttribute('stroke-width', 0.6);
    line.setAttribute('stroke-dasharray', '3 8');
  });

  ILES.forEach(a => {
    const grp = gIsles.querySelector(`[data-id="${a.id}"]`);
    if (grp) grp.style.opacity = '1';
  });

  tooltip.classList.remove('visible');
  document.body.style.cursor = 'crosshair';
}

// ============================================================
// COORDONNÉES DYNAMIQUES (simule un vrai GPS satellite)
// ============================================================
function updateCoords(x, y) {
  const lat = (( (y / H()) - 0.5) * -24 + 2).toFixed(4);
  const lng = (((x / W()) - 0.5) * 60 + 118).toFixed(4);
  const ns = lat >= 0 ? 'N' : 'S';
  const ew = lng >= 0 ? 'E' : 'W';
  coordsEl.innerHTML = `${Math.abs(lat)}° ${ns}<br>${Math.abs(lng)}° ${ew}`;
}

document.addEventListener('mousemove', e => updateCoords(e.clientX, e.clientY));

// ============================================================
// INTRO
// ============================================================
function closeIntro() {
  const intro = document.getElementById('intro');
  intro.classList.add('out');
  setTimeout(() => intro.style.display = 'none', 850);
}
setTimeout(closeIntro, 5500);

// ============================================================
// CSS ANIMATIONS (injectées dynamiquement)
// ============================================================
const css = `
  @keyframes blink-signal {
    0%,100% { opacity: 1; }
    45%     { opacity: 0.2; }
    65%     { opacity: 0.9; }
  }
  @keyframes ring-out {
    0%   { r: 4px; opacity: 0.7; stroke-width: 1.5px; }
    100% { r: 40px; opacity: 0; stroke-width: 0.3px; }
  }
  .ile-group { transition: opacity 0.3s ease; }
`;
const st = document.createElement('style');
st.textContent = css;
document.head.appendChild(st);

buildMap();
window.addEventListener('resize', buildMap);
</script>
